<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decifre o Código</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e1e2f, #111119);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --accent-color: #00adb5;
            --success-color: #39ff14;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 2rem;
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 173, 181, 0.5);
        }

        /* Container dos 3 Dígitos */
        .code-container {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .slot {
            width: 80px;
            height: 110px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Slot do meio (já visível) não tem estilo de clique */
        .slot.static {
            cursor: default;
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Slots interativos */
        .slot.interactive:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 173, 181, 0.4);
            transform: translateY(-5px);
        }

        /* Quando o dígito for resolvido */
        .slot.solved {
            border-color: var(--success-color);
            color: var(--success-color);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
            cursor: default;
            transform: none !important;
        }

        /* Estrutura das Modais (Abas que abrem) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #1a1a26;
            border: 1px solid var(--card-border);
            padding: 2rem;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal h3 {
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        /* Opções de Cores (Esquerda) */
        .color-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .color-btn {
            height: 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-btn:hover { transform: scale(1.05); }
        .btn-red { background-color: #ff4757; }
        .btn-green { background-color: #2ed573; }
        .btn-blue { background-color: #1e90ff; }
        .btn-yellow { background-color: #ffa502; }

        /* Opções de Símbolos (Direita) */
        .symbol-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .symbol-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: white;
            font-size: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .symbol-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Mensagem de Vitória */
        .victory-msg {
            margin-top: 1rem;
            height: 20px;
            font-size: 1.2rem;
            color: var(--success-color);
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .victory-msg.show { opacity: 1; }
    </style>
</head>
<body>

    <h1>Decifre o Código</h1>

    <div class="code-container">
        <div class="slot interactive" id="slot-left" onclick="openModal('modal-color')"></div>
        
        <div class="slot static">0</div>
        
        <div class="slot interactive" id="slot-right" onclick="openModal('modal-symbol')"></div>
    </div>

    <div class="victory-msg" id="victory-text">Parabéns! Código Desbloqueado!</div>

    <div class="modal-overlay" id="modal-color" onclick="closeModal(event)">
        <div class="modal">
            <h3>Qual é a cor certa?</h3>
            <div class="color-options">
                <button class="color-btn btn-red" onclick="checkColor('errada')"></button>
                <button class="color-btn btn-green" onclick="checkColor('errada')"></button>
                <button class="color-btn btn-blue" onclick="checkColor('certa')"></button>
                <button class="color-btn btn-yellow" onclick="checkColor('errada')"></button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-symbol" onclick="closeModal(event)">
        <div class="modal">
            <h3>Escolha o símbolo correto</h3>
            <div class="symbol-options">
                <button class="symbol-btn" onclick="checkSymbol('errado')">▲</button>
                <button class="symbol-btn" onclick="checkSymbol('errado')">◆</button>
                <button class="symbol-btn" onclick="checkSymbol('certo')">★</button>
                <button class="symbol-btn" onclick="checkSymbol('errado')">●</button>
                <button class="symbol-btn" onclick="checkSymbol('errado')">♣</button>
                <button class="symbol-btn" onclick="checkSymbol('errado')">♥</button>
            </div>
        </div>
    </div>

    <script>
        // Variáveis de controle para saber se os enigmas foram resolvidos
        let leftSolved = false;
        let rightSolved = false;

        // Abre a modal correspondente
        function openModal(modalId) {
            // Se o enigma já foi resolvido, não abre a modal de novo
            if (modalId === 'modal-color' && leftSolved) return;
            if (modalId === 'modal-symbol' && rightSolved) return;

            document.getElementById(modalId).classList.add('active');
        }

        // Fecha a modal ao clicar fora dela
        function closeModal(event) {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.classList.remove('active');
            }
        }

        // Força o fechamento direto pelo ID
        function forceClose(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Verifica a resposta do desafio das Cores (Esquerda)
        function checkColor(resposta) {
            if (resposta === 'certa') {
                leftSolved = true;
                const slotLeft = document.getElementById('slot-left');
                slotLeft.textContent = "7"; // Defina o número que quiser para a esquerda
                slotLeft.classList.add('solved');
                slotLeft.classList.remove('interactive');
                forceClose('modal-color');
                checkVictory();
            } else {
                alert("Cor incorreta! Tente novamente.");
            }
        }

        // Verifica a resposta do desafio dos Símbolos (Direita)
        // Defini o símbolo da Estrela (★) como o correto.
        function checkSymbol(resposta) {
            if (resposta === 'certo') {
                rightSolved = true;
                const slotRight = document.getElementById('slot-right');
                slotRight.textContent = "9"; // Defina o número que quiser para a direita
                slotRight.classList.add('solved');
                slotRight.classList.remove('interactive');
                forceClose('modal-symbol');
                checkVictory();
            } else {
                alert("Símbolo incorreto! Tente novamente.");
            }
        }

        // Verifica se ambos os lados foram decifrados
        function checkVictory() {
            if (leftSolved && rightSolved) {
                document.getElementById('victory-text').classList.add('show');
            }
        }
    </script>
</body>
</html>
